name: Build Windows Installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: python -m pip install -U pip pyinstaller pytest
      - name: Run installer-related tests
        run: python -m pytest -q tests/test_startup_imports.py tests/test_host_integration.py tests/test_plugin_installer.py
      - name: Build EXE
        run: pyinstaller --clean --noconfirm installer.spec
      - name: Verify EXE
        shell: powershell
        run: |
          if (!(Test-Path "dist/GameArtToolkitInstaller.exe")) { throw "Installer EXE was not produced." }
          $size=(Get-Item "dist/GameArtToolkitInstaller.exe").Length
          if ($size -lt 1000000) { throw "Installer EXE is unexpectedly small: $size bytes" }
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: GameArtToolkitInstaller-Windows
          path: dist/GameArtToolkitInstaller.exe
