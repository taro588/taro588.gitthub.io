name: Build Windows Installer
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -U pip pyinstaller
      - run: pyinstaller --clean installer.spec
      - uses: actions/upload-artifact@v4
        with:
          name: GameArtToolkitInstaller-Windows
          path: dist/GameArtToolkitInstaller.exe
